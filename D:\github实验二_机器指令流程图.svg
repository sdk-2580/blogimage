<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="920" viewBox="0 0 1020 920">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111111"/>
    </marker>
        <filter id="rough" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="7" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.25" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="paper" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="11" result="grain"/>
      <feColorMatrix in="grain" type="matrix" values="0 0 0 0 0.97  0 0 0 0 0.94  0 0 0 0 0.86  0 0 0 .18 0"/>
    </filter>
    <style>
      .title{font:700 28px "SimSun","FangSong","Microsoft YaHei",serif;fill:#111111}
      .sub{font:16px "SimSun","FangSong","Microsoft YaHei",serif;fill:#111111}
      .box{fill:#ffffff;stroke:#111111;stroke-width:1.5;rx:0;ry:0;}
      .io{fill:#ffffff;stroke:#111111}
      .calc{fill:#ffffff;stroke:#111111}
      .cond{fill:#ffffff;stroke:#111111;}
      .halt{fill:#ffffff;stroke:#111111}
      .text{font:18px "SimSun","FangSong","Microsoft YaHei",serif;fill:#111111}
      .small{font:14px "SimSun","FangSong","Microsoft YaHei",serif;fill:#111111}
      .line{stroke:#111111;stroke-width:1.5;fill:none;marker-end:url(#arrow);stroke-linecap:round;stroke-linejoin:round;}
      .label{font:14px "SimSun","FangSong","Microsoft YaHei",serif;fill:#111111}
    </style>
  </defs>
  <text x="40" y="48" class="title">实验二 机器指令流程图：递减输出</text>
  <text x="40" y="78" class="sub">从 IN 读取初值，R1 装入 01H，循环执行 R0-1；结果为 0 或借位时停机，否则输出并继续。</text>

  <rect x="370" y="115" width="280" height="62" class="box io"/>
  <text x="510" y="141" text-anchor="middle" class="text">00：IN R0,00H</text>
  <text x="510" y="163" text-anchor="middle" class="small">IN[00H] → R0</text>

  <rect x="370" y="220" width="280" height="62" class="box calc"/>
  <text x="510" y="246" text-anchor="middle" class="text">02：LDI R1,01H</text>
  <text x="510" y="268" text-anchor="middle" class="small">01H → R1</text>

  <rect x="370" y="325" width="280" height="62" class="box calc"/>
  <text x="510" y="351" text-anchor="middle" class="text">04：SUB R0,R1</text>
  <text x="510" y="373" text-anchor="middle" class="small">R0 - 1 → R0</text>

  <path d="M510 177 L510 220" class="line"/>
  <path d="M510 282 L510 325" class="line"/>

  <path d="M510 435 L605 520 L510 605 L415 520 Z" class="cond" stroke-width="1.5"/>
  <text x="510" y="510" text-anchor="middle" class="text">05：BZC 0CH</text>
  <text x="510" y="533" text-anchor="middle" class="small">FZ=1 或 FC=1？</text>

  <rect x="370" y="695" width="280" height="62" class="box halt"/>
  <text x="510" y="722" text-anchor="middle" class="text">0C：HLT</text>
  <text x="510" y="744" text-anchor="middle" class="small">停机</text>

  <rect x="90" y="489" width="230" height="62" class="box io"/>
  <text x="205" y="515" text-anchor="middle" class="text">07：OUT 40H,R0</text>
  <text x="205" y="537" text-anchor="middle" class="small">R0 → OUT[40H]</text>

  <rect x="90" y="610" width="230" height="62" class="box"/>
  <text x="205" y="636" text-anchor="middle" class="text">09：JMP 04H</text>
  <text x="205" y="658" text-anchor="middle" class="small">回到递减循环</text>

  <path d="M510 387 L510 435" class="line"/>
  <path d="M510 605 L510 695" class="line"/>
  <text x="528" y="660" class="label">是</text>

  <path d="M415 520 L320 520" class="line"/>
  <text x="356" y="505" class="label">否</text>
  <path d="M205 551 L205 610" class="line"/>
  <path d="M205 610 L205 360 L370 360" class="line"/>
</svg>
