<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="900" viewBox="0 0 1320 900">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111111"/>
    </marker>
        <filter id="rough" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="7" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.25" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="paper" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="11" result="grain"/>
      <feColorMatrix in="grain" type="matrix" values="0 0 0 0 0.97  0 0 0 0 0.94  0 0 0 0 0.86  0 0 0 .18 0"/>
    </filter>
    <style>
      .title{font:700 28px "SimSun","FangSong","Microsoft YaHei",serif;fill:#111111}
      .sub{font:16px "SimSun","FangSong","Microsoft YaHei",serif;fill:#111111}
      .box{fill:#ffffff;stroke:#111111;stroke-width:1.5;rx:0;ry:0;}
      .fetch{fill:#ffffff;stroke:#111111}
      .op{fill:#ffffff;stroke:#111111}
      .branch{fill:#ffffff;stroke:#111111}
      .halt{fill:#ffffff;stroke:#111111}
      .text{font:16px "SimSun","FangSong","Microsoft YaHei",serif;fill:#111111}
      .small{font:13px "SimSun","FangSong","Microsoft YaHei",serif;fill:#111111}
      .line{stroke:#111111;stroke-width:1.5;fill:none;marker-end:url(#arrow);stroke-linecap:round;stroke-linejoin:round;}
      .dash{stroke:#111111;stroke-width:1.5;fill:none;marker-end:url(#arrow);stroke-linecap:round;stroke-linejoin:round;}
      .label{font:13px "SimSun","FangSong","Microsoft YaHei",serif;fill:#111111}
    </style>
  </defs>
  <text x="40" y="48" class="title">实验一 微程序设计图：倍增输出</text>
  <text x="40" y="78" class="sub">机器程序：IN R0,00H → OUT 40H,R0 → ADD R0,R0 → BZC 10H → JMP 02H → HLT</text>

  <rect x="520" y="115" width="280" height="58" class="box fetch"/>
  <text x="660" y="140" text-anchor="middle" class="text">00：NOP</text>
  <text x="660" y="161" text-anchor="middle" class="small">公共取指入口</text>

  <rect x="520" y="210" width="280" height="58" class="box fetch"/>
  <text x="660" y="235" text-anchor="middle" class="text">01：PC → AR，PC+1</text>
  <text x="660" y="256" text-anchor="middle" class="small">准备取机器指令</text>

  <rect x="520" y="305" width="280" height="70" class="box fetch"/>
  <text x="660" y="332" text-anchor="middle" class="text">03：MEM → IR</text>
  <text x="660" y="354" text-anchor="middle" class="small">P&lt;1&gt; 指令译码进入对应入口</text>

  <path d="M660 173 L660 210" class="line"/>
  <path d="M660 268 L660 305" class="line"/>

  <rect x="75" y="445" width="250" height="58" class="box op"/>
  <text x="200" y="470" text-anchor="middle" class="text">32：IN 入口</text>
  <text x="200" y="491" text-anchor="middle" class="small">PC → AR，PC+1</text>

  <rect x="75" y="535" width="250" height="58" class="box op"/>
  <text x="200" y="560" text-anchor="middle" class="text">08：MEM → AR</text>
  <text x="200" y="581" text-anchor="middle" class="small">取输入端口 00H</text>

  <rect x="75" y="625" width="250" height="58" class="box op"/>
  <text x="200" y="650" text-anchor="middle" class="text">09：IO → RD</text>
  <text x="200" y="671" text-anchor="middle" class="small">IN[00H] → R0，返回 01</text>

  <rect x="385" y="445" width="250" height="58" class="box op"/>
  <text x="510" y="470" text-anchor="middle" class="text">33：OUT 入口</text>
  <text x="510" y="491" text-anchor="middle" class="small">PC → AR，PC+1</text>

  <rect x="385" y="535" width="250" height="58" class="box op"/>
  <text x="510" y="560" text-anchor="middle" class="text">0A：MEM → AR</text>
  <text x="510" y="581" text-anchor="middle" class="small">取输出端口 40H</text>

  <rect x="385" y="625" width="250" height="58" class="box op"/>
  <text x="510" y="650" text-anchor="middle" class="text">10：RS → IO</text>
  <text x="510" y="671" text-anchor="middle" class="small">R0 → OUT[40H]，返回 01</text>

  <rect x="695" y="445" width="250" height="58" class="box op"/>
  <text x="820" y="470" text-anchor="middle" class="text">30：ADD 入口</text>
  <text x="820" y="491" text-anchor="middle" class="small">RD → A</text>

  <rect x="695" y="535" width="250" height="58" class="box op"/>
  <text x="820" y="560" text-anchor="middle" class="text">04：RS → B</text>
  <text x="820" y="581" text-anchor="middle" class="small">读取 R0 作为源操作数</text>

  <rect x="695" y="625" width="250" height="58" class="box op"/>
  <text x="820" y="650" text-anchor="middle" class="text">05：A + B → RD</text>
  <text x="820" y="671" text-anchor="middle" class="small">R0 × 2 → R0，返回 01</text>

  <rect x="1005" y="445" width="250" height="58" class="box branch"/>
  <text x="1130" y="470" text-anchor="middle" class="text">3C：BZC/JMP 入口</text>
  <text x="1130" y="491" text-anchor="middle" class="small">PC → AR，PC+1</text>

  <rect x="1005" y="535" width="250" height="58" class="box branch"/>
  <text x="1130" y="560" text-anchor="middle" class="text">1C：MEM → A</text>
  <text x="1130" y="581" text-anchor="middle" class="small">取转移目标地址</text>

  <rect x="1005" y="625" width="250" height="58" class="box branch"/>
  <text x="1130" y="650" text-anchor="middle" class="text">1D：P&lt;2&gt; 寻址处理</text>
  <text x="1130" y="671" text-anchor="middle" class="small">直接寻址，分类转移</text>

  <rect x="915" y="740" width="200" height="58" class="box branch"/>
  <text x="1015" y="764" text-anchor="middle" class="text">0F：P&lt;3&gt;</text>
  <text x="1015" y="786" text-anchor="middle" class="small">判断 FZ/FC</text>

  <rect x="1160" y="740" width="120" height="58" class="box branch"/>
  <text x="1220" y="764" text-anchor="middle" class="text">1B</text>
  <text x="1220" y="786" text-anchor="middle" class="small">A → PC</text>

  <rect x="1040" y="825" width="150" height="50" class="box halt"/>
  <text x="1115" y="855" text-anchor="middle" class="text">35：HLT 循环</text>

  <path d="M620 375 L620 410 L200 410 L200 445" class="dash"/>
  <text x="288" y="416" class="label">IN</text>
  <path d="M640 375 L640 420 L510 420 L510 445" class="dash"/>
  <text x="550" y="414" class="label">OUT</text>
  <path d="M690 375 L690 420 L820 420 L820 445" class="dash"/>
  <text x="760" y="414" class="label">ADD</text>
  <path d="M725 375 L725 420 L1130 420 L1130 445" class="dash"/>
  <text x="960" y="414" class="label">BZC / JMP / HLT</text>

  <path d="M200 503 L200 535" class="line"/>
  <path d="M200 593 L200 625" class="line"/>
  <path d="M325 654 L325 724 L650 724 L650 268" class="dash"/>

  <path d="M510 503 L510 535" class="line"/>
  <path d="M510 593 L510 625" class="line"/>
  <path d="M635 654 L635 724 L660 724 L660 268" class="dash"/>

  <path d="M820 503 L820 535" class="line"/>
  <path d="M820 593 L820 625" class="line"/>
  <path d="M820 683 L820 735 L660 735 L660 268" class="dash"/>

  <path d="M1130 503 L1130 535" class="line"/>
  <path d="M1130 593 L1130 625" class="line"/>
  <path d="M1110 683 L1035 740" class="line"/>
  <path d="M1160 683 L1160 716 L1220 716 L1220 740" class="line"/>
  <text x="1174" y="710" class="label">JMP</text>
  <path d="M1115 798 L1115 825" class="line"/>
  <path d="M1220 798 L1160 825" class="line"/>
  <path d="M980 798 L980 860 L660 860 L660 268" class="dash"/>
  <text x="890" y="835" class="label">BZC 不成立，返回取指</text>
  <text x="1000" y="725" class="label">BZC 成立</text>
</svg>
